name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # auditoría semanal de dependencias

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar catálogo y marcos
        run: npm run validate
      - name: Pruebas del motor, marcos y build
        run: npm test
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E
        run: npm run test:e2e
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
